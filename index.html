<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Checker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="flex flex-col items-center justify-center min-h-screen bg-gray-300">
        <h1
            class="text-3xl font-bold text-indigo-500 underline text-center mb-4 hover:shadow-lg transition-shadow duration-100 cursor-pointer">
            Number Checker</h1>
        <div
            class="bg-white p-4 rounded shadow-md w-full sm:w-82 max-w-[340px] sm:max-w-none border-2 border-indigo-300 rounded-lg shadow-lg hover:shadow-xl transition-shadow duration-100">
            <input type="number" id="numberInput" placeholder="Enter a number" class="w-full sm:w-auto border-none focus:outline-none">
            <button id="checkButton"
                class="bg-blue-400 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full sm:w-25 ml-0 sm:ml-1 mt-2 sm:mt-0">
                Check</button>
            <h3 id="result"></h3>
        </div>
        <a href="/index2.html" target="_blank"
            class="mt-4 text-blue-500 hover:text-blue-700 font-bold transition-colors duration-100">Go to
            Password Checker</a>
    </div>
</body>
<script src="Number_Checker.js"></script>

</html>
